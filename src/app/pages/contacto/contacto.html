<main class="section">
  <h1>Contacto</h1>
  <p class="page-intro">¿Tienes preguntas o quieres ser parte del programa? Escríbenos.</p>

  <div class="alert alert-success" [class.visible]="enviado()" role="status">
    ¡Gracias por tu mensaje! Te responderemos muy pronto.
  </div>

  <form class="form" [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" class="form-control" formControlName="nombre" [class.is-invalid]="invalido('nombre')" />
      <span class="field-error" [class.visible]="invalido('nombre')">Por favor ingresa tu nombre.</span>
    </div>

    <div class="form-group">
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" class="form-control" formControlName="correo" [class.is-invalid]="invalido('correo')" />
      <span class="field-error" [class.visible]="invalido('correo')">Ingresa un correo electrónico válido.</span>
    </div>

    <div class="form-group">
      <label for="asunto">Asunto</label>
      <input type="text" id="asunto" class="form-control" formControlName="asunto" [class.is-invalid]="invalido('asunto')" />
      <span class="field-error" [class.visible]="invalido('asunto')">Por favor ingresa un asunto.</span>
    </div>

    <div class="form-group">
      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" class="form-control" rows="4" formControlName="mensaje" [class.is-invalid]="invalido('mensaje')"></textarea>
      <span class="field-error" [class.visible]="invalido('mensaje')">Escribe tu mensaje antes de enviarlo.</span>
    </div>

    <button type="submit" class="btn btn-accent">Enviar mensaje</button>
  </form>
</main>
